name: pipeline
on:
  schedule:
    - cron: "7,37 0-15 * * *"   # every 30 min, 08:00-23:59 Asia/Kuala_Lumpur
  workflow_dispatch:
  repository_dispatch:
    types: [app_action, new_upload]
permissions:
  contents: read
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STUDIO_REPO }}
          token: ${{ secrets.STUDIO_PAT }}
          path: studio
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: anything to do? (cheap check before installing ffmpeg; nothing is printed)
        id: pre
        env:
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_OAUTH_TOKEN: ${{ secrets.DRIVE_OAUTH_TOKEN }}
        run: |
          pip install -q requests > /dev/null 2>&1
          python jobs/precheck.py > /dev/null 2>&1 || true
      - name: speech model cache
        if: steps.pre.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: tools
        if: steps.pre.outputs.go == 'true'
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null 2>&1
          pip install -q -r requirements.txt > /dev/null 2>&1
          npm install --no-save --silent @vercel/blob > /dev/null 2>&1
      - name: scout + render + deliver (output is kept in the private project, not here)
        if: steps.pre.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_OAUTH_TOKEN: ${{ secrets.DRIVE_OAUTH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BRIEF_ID: ${{ github.event.client_payload.brief_id }}
          ACTION: ${{ github.event.client_payload.action }}
          NOTE: ${{ github.event.client_payload.note }}
        run: |
          mkdir -p state/runlogs
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.action }}" = "app_action" ]; then
            rc=0; python jobs/callback.py > /tmp/job.log 2>&1 || rc=$?
          else
            rc=0; python jobs/pipeline.py > /tmp/job.log 2>&1 || rc=$?
          fi
          tail -n 400 /tmp/job.log > state/runlogs/pipeline.log
          echo "exit code: $rc"
      - name: save state
        if: always()
        run: |
          git config user.name "studio bot" && git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -q -m "pipeline $(date -u +%FT%H:%M)" > /dev/null 2>&1
          git pull -q --rebase --autostash origin main > /dev/null 2>&1 || true
          git push -q origin HEAD:main > /dev/null 2>&1 || true
      - name: push notifications
        if: always() && steps.pre.outputs.go == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          pip install -q requests pywebpush > /dev/null 2>&1
          rc=0; python jobs/send_push.py > /tmp/push.log 2>&1 || rc=$?
          tail -n 100 /tmp/push.log > state/runlogs/push.log
          echo "exit code: $rc"
      - name: save pruned subscriptions
        if: always()
        run: |
          git add state
          git diff --cached --quiet || git commit -q -m "prune push subscriptions" > /dev/null 2>&1
          git pull -q --rebase --autostash origin main > /dev/null 2>&1 || true
          git push -q origin HEAD:main > /dev/null 2>&1 || true
